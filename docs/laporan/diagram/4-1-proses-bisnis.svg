<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1120" viewBox="0 0 2000 1120">
<style>
 text{font-family:Helvetica,Arial,sans-serif}
 .t{font-size:19px;font-weight:700;fill:#111827;text-anchor:middle}
 .s{font-size:15px;fill:#374151;text-anchor:middle}
 .lane{font-size:19px;font-weight:700;fill:#374151;text-anchor:middle}
 .l{font-size:16px;font-weight:700}
</style>
<defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-man" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-ntf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs>
<rect width="2000" height="1120" fill="#ffffff"/>
<text x="28" y="40" style="font-size:23px;font-weight:700;fill:#111827">Dua alur utama: otomatis di ESP32 (kiri) dan kendali manual dari dashboard (kanan)</text>
<text x="28" y="70" style="font-size:16px;fill:#374151">Keputusan otomatis tidak menunggu server, sehingga ventilasi dan penyiraman tetap jalan saat internet putus. Perintah manual tiba seketika lewat MQTT, dengan sinkron HTTP sebagai cadangan.</text>
<rect x="14" y="86" width="1972" height="201" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
<text x="128" y="193.0" class="lane">Pengguna</text>
<rect x="14" y="287" width="1972" height="201" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
<text x="128" y="394.0" class="lane">Dashboard web</text>
<rect x="14" y="488" width="1972" height="201" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
<text x="128" y="583.0" class="lane">Server API,</text>
<text x="128" y="607.0" class="lane">database + broker</text>
<rect x="14" y="689" width="1972" height="201" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
<text x="128" y="796.0" class="lane">ESP32</text>
<rect x="14" y="890" width="1972" height="201" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
<text x="128" y="985.0" class="lane">Sensor &amp;</text>
<text x="128" y="1009.0" class="lane">aktuator</text>
<line x1="242" y1="86" x2="242" y2="1091" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="631" y="142" width="268" height="88" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="765" y="178" class="t">Pantau kondisi</text>
<text x="765" y="206" class="s">dashboard / Telegram</text>
<rect x="1329" y="142" width="268" height="88" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="1463" y="178" class="t">Pilih Manual, tekan tombol</text>
<text x="1463" y="206" class="s">Siram / Buka / Tutup</text>
<rect x="1678" y="142" width="268" height="88" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="1812" y="178" class="t">Melihat hasil</text>
<text x="1812" y="206" class="s">di dashboard</text>
<rect x="631" y="343" width="268" height="88" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="765" y="379" class="t">Tampilkan data</text>
<text x="765" y="407" class="s">model 3D, grafik, log</text>
<rect x="1329" y="343" width="268" height="88" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="1463" y="379" class="t">Kirim perintah</text>
<text x="1463" y="407" class="s">POST /commands</text>
<rect x="1678" y="343" width="268" height="88" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="1812" y="379" class="t">Status terbaru tampil</text>
<text x="1812" y="407" class="s">Live · MQTT, pending ≤ 25 s</text>
<rect x="631" y="544" width="268" height="88" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="765" y="580" class="t">Simpan data</text>
<text x="765" y="608" class="s">readings · actuator_events</text>
<rect x="980" y="544" width="268" height="88" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
<text x="1114" y="580" class="t">Kirim notifikasi Telegram</text>
<text x="1114" y="608" class="s">tangki, sensor, offline, aksi otomatis</text>
<rect x="1329" y="544" width="268" height="88" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="1463" y="580" class="t">Simpan &amp; teruskan perintah</text>
<text x="1463" y="608" class="s">pending + publish MQTT · 60 s</text>
<rect x="1678" y="544" width="268" height="88" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="1812" y="580" class="t">Perbarui status</text>
<text x="1812" y="608" class="s">state MQTT + readings, event web</text>
<rect x="282" y="745" width="268" height="88" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="416" y="781" class="t">Putuskan aksi otomatis</text>
<text x="416" y="809" class="s">ambang, histeresis, stop rule</text>
<rect x="631" y="745" width="268" height="88" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="765" y="781" class="t">Kirim data ke server</text>
<text x="765" y="809" class="s">POST /api/ingest 3 s + state MQTT</text>
<rect x="1329" y="745" width="268" height="88" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="1463" y="781" class="t">Terima &amp; jalankan perintah</text>
<text x="1463" y="809" class="s">seketika lewat MQTT; cadangan: sync</text>
<rect x="1678" y="745" width="268" height="88" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="1812" y="781" class="t">Laporkan state baru</text>
<text x="1812" y="809" class="s">MQTT seketika + reading HTTP</text>
<rect x="282" y="946" width="268" height="88" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="416" y="982" class="t">Ukur kondisi</text>
<text x="416" y="1010" class="s">tanah, suhu, RH (1–2,5 s)</text>
<rect x="631" y="946" width="268" height="88" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="765" y="982" class="t">Pompa / servo bergerak</text>
<text x="765" y="1010" class="s">siram 1 dosis · buka/tutup</text>
<rect x="1329" y="946" width="268" height="88" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="1463" y="982" class="t">Pompa menyiram /</text>
<text x="1463" y="1010" class="s">tutup bergerak</text>
