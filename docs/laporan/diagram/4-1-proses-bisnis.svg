<path d="M1114,124 L1114,108 L765,108 L765,142" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a-n)"/>
<text x="939" y="100" class="l" fill="#374151" text-anchor="middle">tidak, terus memantau</text>
